services:
  database_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ariadne
      POSTGRES_PASSWORD: ariadne_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariadne -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [test-network]
    volumes:
      - product-test-data:/var/lib/postgresql/data

  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      ARIADNE_PRODUCT_DATABASE_URL: postgresql+psycopg://ariadne:ariadne_test_only@database_test:5432/ariadne_test
      ARIADNE_PRODUCT_TEST_DATABASE_URL: postgresql+psycopg://ariadne:ariadne_test_only@database_test:5432/ariadne_test
    depends_on:
      database_test:
        condition: service_healthy
    networks: [test-network]

networks:
  test-network:
    name: ariadne-test-network

volumes:
  product-test-data:
    name: ariadne-test-product-data
