services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ariadne
      POSTGRES_USER: ariadne
      POSTGRES_PASSWORD: ariadne
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariadne"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - metadata-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      ARIADNE_DATABASE_URL: postgresql+psycopg://ariadne:ariadne@database:5432/ariadne
      ARIADNE_ARTIFACT_ROOT: /state/objects
      ARIADNE_WORKSPACE_ROOT: /state/workspaces
      ARIADNE_AUTH_MODE: development
    depends_on:
      database:
        condition: service_healthy

  api:
    build: .
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build: .
    command: ["ariadne-worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifact-data:/state

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  metadata-data:
  artifact-data:
