[project]
name = "causal-atelier"
version = "0.1.0"
description = "Causal discovery and inference platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "causal-learn>=0.1.4.5",
    "dask>=2026.3.0",
    "econml>=0.16.0",
    "fastapi>=0.115.0",
    "httpx2>=0.28.0",
    "ipykernel>=7.2.0",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "rdata>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
causal-atelier-discovery = "causal_atelier.interfaces.cli.discovery:main"
causal-atelier-inference = "causal_atelier.interfaces.cli.inference:main"
causal-atelier-pipeline = "causal_atelier.interfaces.cli.pipeline:main"

[tool.uv.workspace]
members = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_atelier"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.5.2",
    "sphinx-rtd-theme>=3.0.2",
]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.5.2",
    "sphinx-rtd-theme>=3.0.2",
]
